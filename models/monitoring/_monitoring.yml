version: 2

models:
  - name: mon_warehouse_daily_usage
    description: >
      Daily credit-consumption and warehouse-efficiency metrics for the
      configured Snowflake warehouse.
    columns:
      - name: usage_date
        tests: [not_null]
      - name: warehouse_name
        tests: [not_null]
      - name: compute_credits
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: estimated_idle_credits
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: mon_query_performance
    description: >
      Query execution telemetry for identifying long-running and
      high-scan queries on the configured Snowflake warehouse.
    columns:
      - name: query_id
        tests: [unique, not_null]
      - name: warehouse_name
        tests: [not_null]
      - name: total_elapsed_ms
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: bytes_scanned
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: mon_marketing_daily_metrics
    description: >
      Daily channel-level marketing metrics used as the input to anomaly
      detection.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [metric_date, channel]
    columns:
      - name: metric_date
        tests: [not_null]
      - name: channel
        tests: [not_null]

  - name: mon_marketing_anomalies
    description: >
      Rolling z-score anomaly flags for daily ad spend, attributed revenue,
      and conversion rate by channel.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [metric_date, channel]
    columns:
      - name: metric_date
        tests: [not_null]
      - name: channel
        tests: [not_null]
      - name: spend_anomaly
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
      - name: revenue_anomaly
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
      - name: conversion_rate_anomaly
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
      - name: is_any_anomaly
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
