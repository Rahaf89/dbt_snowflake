version: 2

sources:
  - name: raw
    schema: RAW

    tables:
      - name: customers

      - name: google_ads_spend

      - name: meta_ads_spend

      - name: web_events

      - name: orders
        config:
          loaded_at_field: order_timestamp
          freshness:
            warn_after:
              count: 400
              period: day
            error_after:
              count: 800
              period: day