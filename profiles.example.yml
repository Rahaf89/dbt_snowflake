# Copy this to ~/.dbt/profiles.yml (do NOT commit your real profiles.yml)
northwind_marketing:
  target: duckdb
  outputs:

    duckdb:
      type: duckdb
      path: 'northwind.duckdb'
      threads: 4

    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      # key-pair auth preferred over password
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: TRANSFORMER
      database: NORTHWIND
      warehouse: TRANSFORM_WH_XS
      schema: MARTS
      threads: 4
