name: 'northwind_marketing'
version: '1.0.0'
config-version: 2

profile: 'northwind_marketing'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # switch attribution model without touching SQL: first_touch | last_touch | linear
  attribution_model: "linear"
  attribution_window_days: 30
  # reprocess recent events on incremental runs to catch late arrivals
  event_lookback_days: 3
  # Snowflake ACCOUNT_USAGE monitoring window and warehouse
  monitoring_lookback_days: 30
  monitored_warehouse: "TRANSFORM_WH_XS"
  # rolling anomaly detection configuration
  anomaly_lookback_periods: 28
  anomaly_min_history_periods: 7
  anomaly_zscore_threshold: 3.0

models:
  northwind_marketing:

    staging:
      +materialized: view
      +schema: staging

    intermediate:
      +materialized: view
      +schema: intermediate

    marts:
      +materialized: table
      +schema: marts

    monitoring:
      +materialized: view
      +schema: monitoring

snapshots:
  northwind_marketing:
    +target_schema: snapshots