name: 'northwind_marketing'
version: '1.0.0'
config-version: 2

profile: 'northwind_marketing'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # switch attribution model without touching SQL: first_touch | last_touch | linear
  attribution_model: "linear"
  attribution_window_days: 30
  # reprocess recent events on incremental runs to catch late arrivals
  event_lookback_days: 3

models:
  northwind_marketing:

    staging:
      +materialized: view
      +schema: staging

    intermediate:
      +materialized: view
      +schema: intermediate

    marts:
      +materialized: table
      +schema: marts

snapshots:
  northwind_marketing:
    +target_schema: snapshots